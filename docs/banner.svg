<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Deminic: AI employee management that runs on your own server">
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34f5a0"/>
      <stop offset="1" stop-color="#35c9e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="26%" cy="40%" r="62%">
      <stop offset="0" stop-color="#17f08f" stop-opacity=".2"/>
      <stop offset="1" stop-color="#17f08f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#19f09a" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="340" rx="22"/></clipPath>
    <style>
      text { font-family: "JetBrains Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .line { opacity: 0; animation: rise .5s ease-out forwards; }
      .l2 { animation-delay: .5s; } .l3 { animation-delay: 1s; } .l4 { animation-delay: 1.5s; } .l5 { animation-delay: 2s; }
      @keyframes rise { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .line { animation: none; opacity: 1; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="#060a08"/>
    <rect width="1280" height="340" fill="url(#grid)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>
    <text x="64" y="84" font-size="19" fill="#34f5a0">$ ./deminic</text>
    <text x="60" y="186" font-size="96" font-weight="700" fill="url(#word)" letter-spacing="-3">Deminic</text>
    <rect class="cursor" x="486" y="172" width="44" height="10" fill="#34f5a0"/>
    <text x="64" y="240" font-size="24" fill="#e9f5ef">AI employee management that runs</text>
    <text x="64" y="274" font-size="24" fill="#e9f5ef">on your own server.</text>
    <g transform="translate(700 52)">
      <rect width="516" height="236" rx="14" fill="#0a120e" stroke="#19f09a" stroke-opacity=".32"/>
      <path d="M0 14a14 14 0 0 1 14-14h488a14 14 0 0 1 14 14v26H0z" fill="#0f1a14"/>
      <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
      <text x="88" y="25" font-size="14" fill="#7f9a8c">~/deminic/start.cmd</text>
      <g font-size="16.5">
        <text class="line" x="24" y="76" fill="#e9f5ef"><tspan fill="#34f5a0">Redis</tspan> on localhost:6379 is up.</text>
        <text class="line l2" x="24" y="110" fill="#e9f5ef"><tspan fill="#34f5a0">ClamAV</tspan> on localhost:3310 is up.</text>
        <text class="line l3" x="24" y="144" fill="#e9f5ef"><tspan fill="#34f5a0">Postgres</tspan> on localhost:5432 is up.</text>
        <text class="line l4" x="24" y="178" fill="#7f9a8c">Starting the app:</text>
        <text class="line l5" x="24" y="206" fill="#35c9e6">http://127.0.0.1:8000</text>
      </g>
    </g>
  </g>
</svg>
